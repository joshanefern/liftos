<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LiftOS — The workout that logs itself</title>
    <meta name="description" content="Wear your watch, lift, then confirm your sets in 60 seconds. LiftOS turns wearable data into a fully logged strength workout — with an AI coach that actually watched your session." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LiftOS" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4EFE7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1714" />

    <!-- Apply the stored theme before first paint so neither mode flashes
         the other. Must stay in sync with ThemeContext's storage key. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("liftos-theme-v2");
          // No stored choice = dark (the identity); "system" follows the OS.
          var dark =
            t === "dark" ||
            t === null ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) { document.documentElement.classList.add("dark"); }
      })();
    </script>

    <meta property="og:title" content="LiftOS — The workout that logs itself" />
    <meta property="og:description" content="Wear your watch, lift, then confirm your sets in 60 seconds." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
